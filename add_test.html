{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}

<div class="container mt-5 col-md-6">
    <div class="card shadow p-4">
        <h3 class="text-center">Add / Edit Lab Test</h3>

        <form method="POST">
            {% csrf_token %}
            {{ form|crispy }}

            <button class="btn btn-success w-100 mt-3">Save</button>
        </form>
    </div>
</div>

{% endblock %}
