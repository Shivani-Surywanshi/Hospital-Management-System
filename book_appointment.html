{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}

<div class="container mt-5">
    <div class="card p-4 shadow">
        <h3 class="text-center">Book Appointment 📅</h3>

        <form method="POST">
            {% csrf_token %}

            {{ form|crispy }}

            <button class="btn btn-success w-100 mt-3">
                Book Appointment
            </button>
        </form>
    </div>
</div>

{% endblock %}
