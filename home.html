{% extends 'base.html' %}

{% block content %}

<br>

<div class="container mt-5">

    <div class="row justify-content-center mb-4">
        <div class="col-md-12">
            <div class="card shadow p-5 text-center d-flex flex-column justify-content-center align-items-center"
            style="min-height: 500px; background: linear-gradient(135deg, #e3f2fd, #ffffff);">

                <h2 class="mb-2">Hii.. {{ user.username }} 👋</h2>
                <br><br>
                <br><br>

                <!-- Bigger + Colored Heading -->
                <h1 class="fw-bold text-primary mb-4">
                    🏥 Welcome to our Mental Hospital
                </h1>

                <!-- Content -->
                <p class="mt-3 fs-5 text-muted">
                    Your health is our top priority 💙 <br>
                    Connect with experienced doctors anytime
                </p>
            </div>
        </div>
    </div>

            
    <!-- Doctor + Treatment Section -->
    <div class="row justify-content-center">

        <!-- Doctor Card -->
        <div class="col-md-6">
            <div class="card shadow-lg text-center p-4">
                <h4>👨‍⚕️ Doctors</h4><br>
                <a href="{% url 'doctor_list' %}" class="btn btn-warning mt-3 w-75 mx-auto">
                    Go to Doctors
                </a>
            </div>
        </div>

        <!-- Treatment Card -->
        <div class="col-md-6">
            <div class="card shadow-lg text-center p-4">
                <h4>💊 Treatments</h4><br>
                <a href="{% url 'treatment_list' %}" class="btn btn-warning mt-3 w-75 mx-auto">
                    View Treatments
                </a>
            </div>
        </div>

    </div>

</div>

{% endblock %}
