{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}

<div class="container mt-5 col-md-5">
    <div class="card shadow p-4">
        <h3 class="text-center text-primary">Lab Technician Registration</h3>

        <form method="POST">
            {% csrf_token %}
            {{ form|crispy }}

            <button class="btn btn-primary w-100 mt-3">Register</button>
        </form>
    </div>
</div>

{% endblock %}
